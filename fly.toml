# fly.toml —— Fly.io 部署配置（fly launch 后按需调整）
app = "pr-gen-server"
primary_region = "hkg"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[services.ports]]
  handlers = ["http"]
  port = 80

[[services.ports]]
  handlers = ["tls", "http"]
  port = 443

[mounts]
  source = "prgen_data"
  destination = "/app/data"
